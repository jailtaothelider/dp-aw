<!DOCTYPE html>

<head>

  <title>W24 - Acessibilidade WCAG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="w24-acessibilidade.css">
</head>
<body>

  <h1>Acessibilidade: Contraste e Foco</h1>

  <section>
    <h2>Exemplo com CONTRASTE RUIM</h2>
    <button class="btn contraste-ruim">
      Botão com contraste insuficiente
    </button>
  </section>

  <section>
    <h2>Exemplo com CONTRASTE CORRIGIDO (WCAG AA)</h2>
    <button class="btn contraste-bom">
      Botão com contraste adequado
    </button>
  </section>

  <section>
    <h2>Teste de FOCO DE TECLADO</h2>
    <a href="#">Link focável</a><br><br>
    <input type="text" placeholder="Campo de texto">
  </section>

  <p>
    Use a tecla <strong>Tab</strong> para navegar pelos elementos e ver o foco.
  </p>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
</head>
<body>

  <h1>Formulário de Cadastro</h1>

  <form>

    <label>Nome:</label><br>
    <input type="text"><br><br>

    <label>E-mail:</label><br>
    <input type="email"><br><br>

    <label>Senha:</label><br>
    <input type="password"><br><br>

    <label>Cidade:</label><br>
    <input type="text"><br><br>

    <label>Estado:</label><br>
    <select>
      <option>Selecione</option>
      <option>RN</option>
      <option>SP</option>
      <option>RJ</option>
    </select>
    <br><br>

    <label>Gênero:</label><br>
    <input type="radio" name="genero"> Masculino<br>
    <input type="radio" name="genero"> Feminino<br><br>

    <label>Interesses:</label><br>
    <input type="checkbox"> Esporte<br>
    <input type="checkbox"> Música<br>
    <input type="checkbox"> Tecnologia<br><br>

    <button type="submit">Cadastrar</button>

  </form>

</body>
</html>

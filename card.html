<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Card de Produto Responsivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="card.css">
</head>

<body>
  <div class="card">
    <img src="img/surdo.jpg" alt="Surdo">

    <div class="card-info">
      <h2>Surdo 22 polegadas</h2>
      <p>Dtambor grande e grave, fundamental na percussão brasileira (samba, axé, carnaval), com diâmetro de 22" e profundidade variando (ex: 50cm ou 60cm), que produz um som potente e encorpado.</p>
      <span class="preco">R$ 669,90</span>
    </div>
  </div>
</body>
</html>

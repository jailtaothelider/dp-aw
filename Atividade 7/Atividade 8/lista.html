<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Listas em HTML</title>
</head>
<body>

  <h1>Listas em HTML</h1>

  <h2>Lista Ordenada</h2>
  <ol>
    <li>Estudar HTML</li>
    <li>Estudar CSS</li>
    <li>Estudar JavaScript</li>
  </ol>

  <h2>Lista Não Ordenada</h2>
  <ul>
    <li>Arroz</li>
    <li>Feijão</li>
    <li>Macarrão</li>
  </ul>

  <h2>Lista de Definição</h2>
  <dl>
    <dt>HTML</dt>
    <dd>Linguagem de marcação para criar páginas web.</dd>

    <dt>CSS</dt>
    <dd>Linguagem usada para estilizar páginas web.</dd>
  </dl>

</body>
</html>

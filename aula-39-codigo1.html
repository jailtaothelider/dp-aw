<!DOCTYPE html>
<html lang="pt-BR" data-theme="ifrn-webeti">
<head>
  <meta charset="UTF-8">
  <title>Aula 39 - DaisyUI</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="aula-39-style-tema.css">
</head>

<body class="p-6">
  <h1 class="text-3xl font-bold mb-4">Tema IFRN WebETI</h1>

  <select id="theme-select" class="select select-bordered mb-4">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="ifrn-webeti">IFRN WebETI</option>
  </select>

  <button class="btn btn-primary">Botão teste</button>

  <script>
    document.getElementById("theme-select").addEventListener("change", e => {
      document.documentElement.setAttribute("data-theme", e.target.value);
    });
  </script>
</body>
</html>

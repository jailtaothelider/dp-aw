<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Minha Landing Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Meu Projeto</h1>
    <p>Uma página simples e bonita</p>
  </header>

  <main>

    <section>
      <h2>Sobre</h2>
      <p>Essa é uma landing page feita como atividade de HTML e CSS.</p>
    </section>

    <section>
      <h2>Vantagens</h2>
      <ul>
        <li>Layout simples</li>
        <li>Fácil leitura</li>
        <li>Design limpo</li>
      </ul>
    </section>

    <section>
      <h2>Galeria</h2>
      <img src="https://via.placeholder.com/300" alt="Imagem exemplo">
    </section>

    <section>
      <h2>Contato</h2>
      <form>
        <input type="text" placeholder="Seu nome"><br><br>
        <input type="email" placeholder="Seu e-mail"><br><br>
        <textarea placeholder="Mensagem"></textarea><br><br>
        <button type="submit">Enviar</button>
      </form>
    </section>

  </main>

  <footer>
    <p>© 2025 - Meu Site</p>
  </footer>

</body>
</html>
